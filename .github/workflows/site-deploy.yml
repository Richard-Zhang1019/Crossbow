name: site

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crossbow/site build
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      # Re-running a run appends another artifact named github-pages; deploy-pages
      # then refuses to pick one. Clear artifacts left by earlier attempts first.
      - name: Drop stale github-pages artifacts from earlier attempts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId, per_page: 100,
            });
            for (const artifact of data.artifacts.filter((item) => item.name === "github-pages")) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
            }
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
