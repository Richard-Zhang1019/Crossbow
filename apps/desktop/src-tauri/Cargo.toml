[package]
name = "crossbow-desktop"
description = "Crossbow macOS shell (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "crossbow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
ureq = "2"
regex = "1"
socket2 = "0.6"
uuid = { version = "1", features = ["v4"] }
tungstenite = "0.30"
tar = "0.4"
serde_yaml = "0.9"
flate2 = "1"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
url = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
crossbow-core = { path = "../../../crates/crossbow-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
crossbow-service = { path = "../../service" }
dbus = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "std",
    "NSButton",
    "NSColor",
    "NSFont",
    "NSParagraphStyle",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSProgressIndicator",
    "NSView",
    "NSTrackingArea",
    "NSMenu",
    "NSMenuItem",
    "NSAttributedString",
    "NSAppearance",
    "NSWindow",
    "NSResponder",
    "NSCell",
    "NSControl",
    "NSBezierPath",
    "NSImage",
    "NSImageView",
    "NSTextAttachment",
    "NSStringDrawing",
    "NSGraphicsContext",
    "NSApplication",
    "NSTextField",
    "NSEvent",
] }
objc2-foundation = { version = "0.3", features = ["std", "NSGeometry", "NSString", "NSDictionary", "NSArray", "NSAttributedString", "NSNotification", "NSRange"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinInet", "Win32_Graphics_Dwm", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
