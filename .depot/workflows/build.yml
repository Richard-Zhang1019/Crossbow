# Depot CI Migration
# Source: .github/workflows/build.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/
# - Keep Depot jobs on Linux; native macOS/Windows builds run in .github/workflows/build.yml

name: build

# Depot runs Linux jobs; native macOS/Windows validation remains in the GitHub workflow.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact release commit to test
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ inputs.ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.final.outputs.rust }}
      frontend: ${{ steps.final.outputs.frontend }}
    steps:
      # 路径门控只作用于 PR：push 与 workflow_call（发版链路）始终全量运行，
      # 由下面 final 步强制置 true，发版门禁不受影响。
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/service/**'
              - 'apps/desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'scripts/ci/**'
              - '.depot/workflows/build.yml'
            frontend:
              - 'apps/desktop/src/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'apps/desktop/vite.config.ts'
              - 'apps/desktop/tsconfig.json'
              - 'pnpm-lock.yaml'
      - id: final
        env:
          EVENT: ${{ github.event_name }}
          FILTER_RUST: ${{ steps.filter.outputs.rust }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "rust=${FILTER_RUST:-false}" >> "$GITHUB_OUTPUT"
            echo "frontend=${FILTER_FRONTEND:-false}" >> "$GITHUB_OUTPUT"
          else
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend (typecheck, build, tests)
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 10
    needs: [changes]
    # 纯前端 PR：跳过三平台桌面矩阵，用轻量 Linux job 反馈 tsc/vite/前端测试。
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.rust != 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and build frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Frontend node tests
        run: |
          node --experimental-strip-types --test \
            apps/desktop/src/lib/stateReliability.test.mjs \
            apps/desktop/src/lib/workflow.test.mjs \
            apps/desktop/src/layouts/layout.test.mjs \
            apps/desktop/src/components/Button/buttonUsage.test.mjs \
            apps/desktop/src/components/NodeName/nodeFlags.test.mjs \
            apps/desktop/src/components/FitItems/fitGrid.test.mjs \
            apps/desktop/src/pages/Logs/logHistory.test.mjs \
            apps/desktop/src/pages/Logs/logReading.test.mjs

  linux-foundation:
    name: Linux foundation (build and tests)
    runs-on: depot-ubuntu-24.04 # was: ubuntu-24.04. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 35
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - run: python3 scripts/ci/download_sidecar.py x86_64-unknown-linux-gnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - run: cargo test --locked -p crossbow-core
      - run: cargo test --locked -p crossbow-service
      - run: cargo build --locked --release -p crossbow-service
      - run: cargo test --locked --lib -p crossbow-desktop
      - run: node --experimental-strip-types --test apps/desktop/src/components/NodeName/nodeFlags.test.mjs apps/desktop/src/components/FitItems/fitGrid.test.mjs apps/desktop/src/pages/Logs/logHistory.test.mjs
      - name: Build Linux executable (no public installer yet)
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle --config tauri.ci.conf.json
      - name: Package and verify experimental Linux archive
        run: python3 scripts/ci/package_linux.py
      - uses: actions/upload-artifact@v7
        with:
          name: crossbow-linux-x86_64-experimental
          path: dist-linux/Crossbow_*_linux_x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  pipeline-check:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/ci/release_checks.py source
      - run: python -m unittest discover -s scripts/ci/tests -v
      - run: python -m unittest discover -s scripts/tests -v
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      - name: Check workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -shellcheck=
