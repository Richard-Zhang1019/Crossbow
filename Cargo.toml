[workspace]
resolver = "2"
members = [
    "crates/crossbow-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0"
authors = ["Crossbow Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
