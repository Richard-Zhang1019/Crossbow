<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>DNS 设置卡片 · 可编辑源稿</title></head>
<body style="font-family:-apple-system,sans-serif;max-width:560px;margin:24px auto;">
<h2>DNS 设置卡片（静态可编辑源稿）</h2>
<p>实现以 React 组件为准：apps/desktop/src/pages/Settings/DnsSettings.tsx。
本文件为视觉源稿，供无构建环境比对。样式 token 见 styles/tokens.css。</p>
<div style="border:1px solid #e4e7ee;border-radius:10px;padding:16px;">
  <div style="font-size:12px;font-weight:600;color:#596777;">DNS 解析</div>
  <div style="display:grid;grid-template-columns:42% 1fr;gap:12px;align-items:center;margin:12px 0;">
    <div><b style="font-size:13px;">模式</b></div>
    <div style="display:inline-flex;background:#f0f2f7;border-radius:8px;padding:2px;">
      <span style="padding:4px 14px;border-radius:6px;">沿用订阅</span>
      <span style="padding:4px 14px;border-radius:6px;background:#fff;font-weight:600;">自定义</span>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:42% 1fr;gap:12px;align-items:center;margin:12px 0;">
    <div><b style="font-size:13px;">代理业务上游</b></div>
    <input style="height:30px;border-radius:8px;border:1px solid #cdd2df;padding:0 10px;" value="https://doh.pub/dns-query, 223.5.5.5">
  </div>
  <div style="display:grid;grid-template-columns:42% 1fr;gap:12px;align-items:center;margin:12px 0;">
    <div><b style="font-size:13px;">直连业务上游</b></div>
    <input style="height:30px;border-radius:8px;border:1px solid #cdd2df;padding:0 10px;" value="223.5.5.5">
  </div>
  <div style="display:grid;grid-template-columns:42% 1fr;gap:12px;align-items:center;margin:12px 0;">
    <div><b style="font-size:13px;">节点引导上游</b></div>
    <input style="height:30px;border-radius:8px;border:1px solid #cdd2df;padding:0 10px;" value="tls://dns.google">
  </div>
</div>
</body></html>
